datasets: [metr-la, pems-bay, sunt]
seeds: [7, 42, 101, 123, 314]

windows:
  metr-la:  {input_steps: 12, horizon: 12}
  pems-bay: {input_steps: 12, horizon: 12}
  sunt:
    input_steps: 168
    horizon: 24
    features: [n_boardings, n_alightings]
    target: n_boardings

data:
  batch_size: 32
  num_workers: 0

model:
  name: gru
  hidden_size: 64
  num_layers: 1
  cl_decay_steps: 2000
  use_curriculum_learning: true

training:
  learning_rate: 0.001
  max_epochs: 100
  patience: 10
  early_stopping_min_delta: 0.005
  gradient_clip_norm: 5.0

execution:
  cpus_per_run: 1
  max_parallel: 1
output: results/centralized_gru
