# Hiperparâmetros do treino centralizado — iguais a sunt-fedstgnn/config/experiments/sunt/client_scaling.yaml
datasets: [metr-la, pems-bay, sunt]
seeds: [7, 42, 101, 123, 314]

# janela / horizonte por dataset
windows:
  metr-la:  {input_steps: 12, horizon: 12}   # padrão DCRNN (1 h -> 1 h em passos de 5 min)
  pems-bay: {input_steps: 12, horizon: 12}
  sunt:                                       # entrada = [embarques, desembarques]; alvo = embarques; 168 h -> 24 h (ciclo semanal completo)
    input_steps: 168
    horizon: 24
    features: [n_boardings, n_alightings]   # `loading` retirado da entrada em 23/09
    target: n_boardings      # alvo do sunt-fedstgnn (signal: n_boardings); `loading` até 23/09

data:
  batch_size: 32
  num_workers: 0

model:
  name: leconv
  hidden_size: 64

training:
  learning_rate: 0.001
  max_epochs: 100
  patience: 10
  early_stopping_min_delta: 0.005
  gradient_clip_norm: 5.0

execution:
  cpus_per_run: 4
  # gpus: [0]            # opcional: restringe às GPUs listadas (índices do nvidia-smi); ausente = todas
  gpus_per_run: 1        # fração permitida (ex.: 0.2 = 5 runs leves na mesma placa)
  max_parallel: 5        # terumo: 1x L40S + 4x A16
  ray_temp_dir: .ray

output: results/centralized
