method: ditto
datasets: [metr-la, pems-bay, sunt]
seeds: [7, 42, 101, 123, 314]

windows:
  metr-la:  {input_steps: 12, horizon: 12}
  pems-bay: {input_steps: 12, horizon: 12}
  sunt:
    input_steps: 168
    horizon: 24
    features: [n_boardings, n_alightings]
    target: n_boardings

data:
  batch_size: 32
  num_workers: 0

model:
  name: leconv
  hidden_size: 64

ditto:
  num_clients: [5, 10, 20]
  num_clients_per_dataset:
    sunt: [5, 20, 163]
  lambda: [0, 0.01, 0.1, 1.0, per_client]
  lambda_candidates: [0.01, 0.1, 1.0]
  partition_seed: 42
  learning_rate: 0.001
  optimizer: adam_reset_each_round
  local_epochs: 1
  max_rounds: 400
  patience: 30
  early_stopping_min_delta: 0.005
  gradient_clip_norm: 5.0
  participation_fraction: 1.0
  aggregation_weight: train_observations

execution:
  cpus_per_run: 1
  gpus_per_run: 1
  max_parallel: 1
output: results/ditto_leconv
