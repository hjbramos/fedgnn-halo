# Ditto (Li, Hu, Beirami & Smith, ICML 2021) com LEConv sobre as partições Leiden.
# Mesmo protocolo do fedavg_leconv.yaml para o modelo global; cada cliente mantém ainda um modelo
# personalizado v_k treinado em F_k(v) + (lambda/2)·||v - w_t||², que é o que se avalia.
# Grade de lambda: valores fixos (cobrem a escala do mu do FedProx e a do paper) + `per_client`, a
# seleção do paper (Sec. 4 / Ap. D.2): cada cliente escolhe o seu lambda entre `lambda_candidates`
# pelo MAE na sua validação local (mantém um v_k por candidato; custo local ∝ nº de candidatos).
method: ditto
datasets: [metr-la, pems-bay, sunt]
seeds: [7, 42, 101, 123, 314]

windows:
  metr-la:  {input_steps: 12, horizon: 12}
  pems-bay: {input_steps: 12, horizon: 12}
  sunt:
    input_steps: 168
    horizon: 24
    features: [n_boardings, n_alightings]   # `loading` retirado da entrada em 23/09
    target: n_boardings      # alvo do sunt-fedstgnn (signal: n_boardings); `loading` até 23/09

data:
  batch_size: 32
  num_workers: 0

model:
  name: leconv
  hidden_size: 64

ditto:
  num_clients: [5, 10, 20]
  num_clients_per_dataset:        # grade do SUNT (a mesma do FedGNNHet): 5→6, 20, 163→166
    sunt: [5, 20, 163]
  lambda: [0, 0.01, 0.1, 1.0, per_client]   # 0 = controle de treino local puro (acrescentado em 25/09, após k=5)
  lambda_candidates: [0.01, 0.1, 1.0]  # conjunto de 3 valores, como no paper ({0.1, 1, 2} lá)
  partition_seed: 42
  learning_rate: 0.001
  optimizer: adam_reset_each_round     # em ambos os modelos (w e v_k)
  local_epochs: 1                      # o mesmo nº de épocas para w e para v_k (como no paper)
  max_rounds: 400
  patience: 30                         # early stopping pelo MAE micro de validação dos {v_k}
  early_stopping_min_delta: 0.005
  gradient_clip_norm: 5.0
  participation_fraction: 1.0
  aggregation_weight: train_observations

execution:
  cpus_per_run: 4
  # gpus: [0]
  gpus_per_run: 0.5      # 2 execuções por GPU: execução limitada por CPU (1 núcleo, GPU ~10 %)
  max_parallel: 10
  ray_temp_dir: .ray

output: results/ditto_leconv
