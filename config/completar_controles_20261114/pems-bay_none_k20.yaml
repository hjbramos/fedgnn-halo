# Ampliação dos controles em 14/11/2026. Protocolo em PROTOCOLO.md.
method: fedgnnhet
datasets:
- pems-bay
seeds:
- 7
- 42
- 101
- 123
- 314
windows:
  pems-bay:
    input_steps: 12
    horizon: 12
data:
  batch_size: 32
  num_workers: 0
model:
  name: leconv
  hidden_size: 64
fedgnnhet:
  num_clients:
  - 20
  halo:
  - none
  partition_seed: 42
  learning_rate: 0.001
  optimizer: adam_reset_each_round
  local_epochs: 1
  max_rounds: 400
  patience: 30
  early_stopping_min_delta: 0.005
  gradient_clip_norm: 5.0
  participation_fraction: 1.0
  aggregation_weight: train_observations
  evaluate_test: true
  keep_last_checkpoint: true
execution:
  cpus_per_run: 3
  gpus_per_run: 1
  max_parallel: 1
output: results/completar_controles_20261114/pems-bay_none_k20
