# FedGNNHet com LEConv sobre as partições Leiden: FedAvg 0-hop + halo de fronteira.
# `halo` é a grade: none (== FedAvg 0-hop), static (resumo estático do vizinho externo, papel da
# BoundaryTable/EMA do FedGNNHet original) e 1hop (agregado por janela; exato para a LEConv).
# Mesmo protocolo do fedavg_leconv.yaml. SUNT inclui k=163 (-> 166) para ter fronteira suficiente.
method: fedgnnhet
datasets: [metr-la, pems-bay, sunt]
seeds: [7, 42, 101, 123, 314]

windows:
  metr-la:  {input_steps: 12, horizon: 12}
  pems-bay: {input_steps: 12, horizon: 12}
  sunt:
    input_steps: 168
    horizon: 24
    features: [n_boardings, n_alightings]   # `loading` retirado da entrada em 23/09
    target: n_boardings      # alvo do sunt-fedstgnn (signal: n_boardings); `loading` até 23/09

data:
  batch_size: 32
  num_workers: 0

model:
  name: leconv
  hidden_size: 64

fedgnnhet:
  num_clients: [5, 10, 20]
  num_clients_per_dataset:
    sunt: [5, 20, 163]
  halo: [1hop, static, none]
  partition_seed: 42
  learning_rate: 0.001
  optimizer: adam_reset_each_round
  local_epochs: 1
  max_rounds: 400
  patience: 30
  early_stopping_min_delta: 0.005
  gradient_clip_norm: 5.0
  participation_fraction: 1.0
  aggregation_weight: train_observations

execution:
  cpus_per_run: 4
  # gpus: [0]
  gpus_per_run: 1
  max_parallel: 5
  ray_temp_dir: .ray

output: results/fedgnnhet_leconv
