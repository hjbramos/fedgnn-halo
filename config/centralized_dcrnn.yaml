datasets: [metr-la, pems-bay, sunt]
seeds: [7, 42, 101, 123, 314]

windows:
  metr-la:  {input_steps: 12, horizon: 12}
  pems-bay: {input_steps: 12, horizon: 12}
  sunt:
    input_steps: 168
    horizon: 24
    features: [n_boardings, n_alightings]
    target: n_boardings

data:
  batch_size: 64
  batch_size_per_dataset:
    sunt: 8
  num_workers: 0

model:
  name: dcrnn
  hidden_size: 64
  num_layers: 2
  max_diffusion_step: 2
  cl_decay_steps: 2000
  use_curriculum_learning: true
  gradient_checkpointing_per_dataset:
    sunt: true

training:
  learning_rate: 0.01
  epsilon: 0.001
  lr_decay_epochs: [20, 30, 40, 50]
  lr_decay_ratio: 0.1
  max_epochs: 100
  max_epochs_per_dataset:
    metr-la: 120
    pems-bay: 150
    sunt: 200
  patience: 15
  early_stopping_min_delta: 0.0
  gradient_clip_norm: 5.0

execution:
  cpus_per_run: 1
  gpus_per_run: 1
  max_parallel: 1
output: results/centralized_dcrnn
