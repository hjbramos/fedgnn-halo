# Ablação do valor da estrutura espacial: LEConv SEM arestas (só auto-laço por nó).
# Idêntico ao centralized.yaml em tudo o resto — a única diferença é `self_loops_only: true`.
# Comparar com results/centralized (LEConv com grafo) e results/centralized_gru (sem grafo, temporal forte).
datasets: [metr-la, pems-bay, sunt]
seeds: [7, 42, 101, 123, 314]

windows:
  metr-la:  {input_steps: 12, horizon: 12}
  pems-bay: {input_steps: 12, horizon: 12}
  sunt:
    input_steps: 168
    horizon: 24
    features: [n_boardings, n_alightings]   # `loading` retirado da entrada em 23/09
    target: n_boardings      # alvo do sunt-fedstgnn (signal: n_boardings); `loading` até 23/09

data:
  batch_size: 32
  num_workers: 0

model:
  name: leconv
  hidden_size: 64
  self_loops_only: true

training:
  learning_rate: 0.001
  max_epochs: 100
  patience: 10
  early_stopping_min_delta: 0.005
  gradient_clip_norm: 5.0

execution:
  cpus_per_run: 2
  gpus_per_run: 0.2
  max_parallel: 3
  ray_temp_dir: .ray

output: results/centralized_noedges
