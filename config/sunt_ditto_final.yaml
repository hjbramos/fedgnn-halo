# CAMPANHA FINAL do Ditto `per_client` no SUNT (alvo n_boardings), célula k=20 (pedido 20), no TERUMO.
# Mesmo protocolo do Ditto k=6 do desktop (config/sunt_ditto_final_desktop.yaml) e das demais campanhas do
# SUNT na célula: 600 rodadas fixas, sem parada antecipada, checkpoint pela melhor validação (MAE micro dos
# {v_k}), teste avaliado uma vez ao fim; λ por cliente entre {0,01; 0,1; 1} pela validação local. Custo
# medido no smoke de 02/10: ~4× o FedAvg por rodada. Lançamento:
#   --clients 20 --lam per_client --max-epochs 600

method: ditto
datasets: [sunt]
seeds: [7, 42, 101, 123, 314]

windows:
  sunt:
    input_steps: 168
    horizon: 24
    features: [n_boardings, n_alightings]
    target: n_boardings

data:
  batch_size: 32
  num_workers: 0

model:
  name: leconv
  hidden_size: 64

ditto:
  num_clients: [20]
  lambda: [per_client]
  lambda_candidates: [0.01, 0.1, 1.0]
  partition_seed: 42
  learning_rate: 0.001
  optimizer: adam_reset_each_round
  local_epochs: 1
  max_rounds: 600
  patience: 100000                # sem parada antecipada
  early_stopping_min_delta: 0.0
  gradient_clip_norm: 5.0
  participation_fraction: 1.0
  aggregation_weight: train_observations

execution:
  cpus_per_run: 4                 # 03/10 04h: carga ~25 em 60; 5 × 4 = 20 núcleos
  gpus: [0, 1, 2, 3, 4]
  gpus_per_run: 1
  max_parallel: 5
  worker_niceness: 0
  ray_temp_dir: .ray

output: results/sunt_ditto_final
