[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fedgnn-halo"
version = "0.1.0"
description = "Experimentos modulares de previsão espaço-temporal federada em grafos"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
authors = [{name = "Helder José Bastos Ramos"}]
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=16,<24",
  "requests>=2.32,<3", "huggingface_hub>=0.25,<2", "PyYAML>=6,<7",
  "torch>=2.5,<3", "torch-geometric>=2.6,<3", "networkx>=3.3,<4",
  "igraph>=0.11,<2", "leidenalg>=0.10,<1"
]

[project.optional-dependencies]
reproduction = ["scipy>=1.13,<2", "matplotlib>=3.9,<4"]
notebooks = ["jupyterlab>=4,<5", "nbconvert>=7,<8", "matplotlib>=3.9,<4"]
dev = ["pytest>=8,<10", "build>=1,<2"]
distributed = ["ray>=2.38,<3"]

[project.scripts]
fedgnn-halo = "fedgnn_halo.cli:main"

[tool.setuptools.packages.find]
include = ["fedgnn_halo*", "models*", "federation*", "data_loader*", "experiments*"]
