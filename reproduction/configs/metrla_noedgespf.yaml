datasets:
- metr-la
seeds:
- 7
- 42
- 101
- 123
- 314
windows:
  metr-la:
    input_steps: 12
    horizon: 12
data:
  batch_size: 32
  num_workers: 0
model:
  name: leconv
  hidden_size: 64
  self_loops_only: true
training:
  learning_rate: 0.001
  max_epochs: 400
  patience: 30
  early_stopping_min_delta: 0.005
  gradient_clip_norm: 5.0
execution:
  cpus_per_run: 1
  max_parallel: 1
  gpus_per_run: 1
output: results/reproduced/metrla_noedgespf
