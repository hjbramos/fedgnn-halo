data:
  batch_size: 32
  num_workers: 0
datasets:
- sunt
execution:
  cpus_per_run: 4
  gpus_per_run: 1
  max_parallel: 1
  ray_temp_dir: .ray
model:
  hidden_size: 64
  name: leconv
output: results/embarques_desembarques
seeds:
- 7
- 42
- 101
training:
  early_stopping_min_delta: 0.0
  evaluate_test: false
  gradient_clip_norm: 5.0
  learning_rate: 0.001
  max_epochs: 100
  patience: 999
  keep_last_checkpoint: true
windows:
  sunt:
    features:
    - n_boardings
    - n_alightings
    horizon: 24
    input_steps: 168
    target: n_boardings
