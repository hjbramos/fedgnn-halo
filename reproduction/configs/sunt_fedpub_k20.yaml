method: fedpub
datasets:
- sunt
seeds:
- 7
- 42
- 101
- 123
- 314
windows:
  sunt:
    input_steps: 168
    horizon: 24
    features:
    - n_boardings
    - n_alightings
    target: n_boardings
data:
  batch_size: 32
  num_workers: 0
model:
  name: leconv
  hidden_size: 64
fedpub:
  num_clients:
  - 20
  partition_seed: 42
  tau: 3.0
  similarity_source: representation_pre_activation
  lambda_l1:
  - 1.0e-05
  lambda_prox: 0.001
  mask_threshold: 0.001
  proxy_graph:
    blocks: 5
    nodes_per_block: 100
    p_in: 0.1
    p_out: 0.01
    seed: 0
  learning_rate: 0.001
  optimizer: adam_reset_each_round
  local_epochs: 1
  max_rounds: 600
  patience: 100000
  early_stopping_min_delta: 0.0
  gradient_clip_norm: 5.0
  participation_fraction: 1.0
  evaluate_test: true
execution:
  cpus_per_run: 1
  max_parallel: 1
  gpus_per_run: 1
output: results/reproduced/sunt_fedpub_k20
