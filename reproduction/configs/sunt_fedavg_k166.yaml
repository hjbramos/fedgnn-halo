method: fedavg
datasets:
- sunt
seeds:
- 7
- 42
- 101
- 123
- 314
windows:
  sunt:
    input_steps: 168
    horizon: 24
    features:
    - n_boardings
    - n_alightings
    target: n_boardings
data:
  batch_size: 32
  num_workers: 0
model:
  name: leconv
  hidden_size: 64
federated:
  num_clients:
  - 163
  partition_seed: 42
  learning_rate: 0.001
  optimizer: adam_reset_each_round
  local_epochs: 1
  max_rounds: 1000
  patience: 100000
  early_stopping_min_delta: 0.0
  gradient_clip_norm: 5.0
  participation_fraction: 1.0
  aggregation_weight: train_observations
  evaluate_test: true
  rounds_by_clients:
    6: 600
    20: 600
    166: 1000
execution:
  cpus_per_run: 1
  max_parallel: 1
  gpus_per_run: 1
output: results/reproduced/sunt_fedavg_k166
